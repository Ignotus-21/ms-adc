[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-adc-semiconductor-agent"
version = "1.0.0"
description = "Multimodal Semiconductor Defect Classification & Root-Cause Analysis Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kshitiz Khandelwal", email = "kshitiz@google.com" },
    { name = "Aditya Sharma", email = "itsadi@google.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "google-genai>=0.1.1",
    "google-cloud-aiplatform>=1.44.0",
    "google-cloud-bigquery>=3.18.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-dlp>=3.15.0",
    "google-cloud-logging>=3.9.0",
    "google-cloud-trace>=1.11.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "opencv-python-headless>=4.9.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "tensorboard>=2.15.0",
    "mlflow>=2.10.0",
    "onnx>=1.16.0",
    "onnxscript>=0.1.0",
    "safetensors>=0.4.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]
